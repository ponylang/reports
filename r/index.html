<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pony Reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fafaf9;
  --fg: #1c1917;
  --muted: #78716c;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --border: #e7e5e4;
  --code-bg: #f5f5f4;
  --card-bg: #ffffff;
  --nav-bg: #1c1917;
  --nav-fg: #d6d3d1;
  --nav-active: #60a5fa;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0a09;
    --fg: #e7e5e4;
    --muted: #a8a29e;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --border: #292524;
    --code-bg: #1c1917;
    --card-bg: #1c1917;
    --nav-bg: #0c0a09;
    --nav-fg: #a8a29e;
    --nav-active: #60a5fa;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0c0a09;
  --fg: #e7e5e4;
  --muted: #a8a29e;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --border: #292524;
  --code-bg: #1c1917;
  --card-bg: #1c1917;
  --nav-bg: #0c0a09;
  --nav-fg: #a8a29e;
  --nav-active: #60a5fa;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
  margin: 0;
  padding: 0;
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 220px;
  height: 100vh;
  background: var(--nav-bg);
  color: var(--nav-fg);
  padding: 24px 0;
  overflow-y: auto;
  z-index: 100;
  display: flex;
  flex-direction: column;
}

nav .site-label {
  padding: 0 16px 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

nav .site-title {
  padding: 0 16px 20px;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  line-height: 1.4;
}

nav ul { list-style: none; padding: 12px 0; margin: 0; flex: 1; }

nav a {
  display: block;
  padding: 7px 16px 7px 20px;
  color: var(--nav-fg);
  text-decoration: none;
  font-size: 13px;
  transition: background 0.15s, color 0.15s;
  position: relative;
}

nav a:hover { background: rgba(255,255,255,0.05); }

nav a.active {
  color: var(--nav-active);
  background: rgba(96,165,250,0.08);
}

nav a.active::before {
  content: '';
  position: absolute;
  left: 0; top: 4px; bottom: 4px;
  width: 3px;
  background: var(--nav-active);
  border-radius: 0 2px 2px 0;
}

main {
  margin-left: 220px;
  padding: 32px 48px;
  max-width: 860px;
}

section { margin-bottom: 48px; scroll-margin-top: 24px; }

h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); display: inline-block; }

.summary-box {
  background: var(--accent-soft);
  border-left: 4px solid var(--accent);
  padding: 14px 18px;
  margin-bottom: 20px;
  border-radius: 0 6px 6px 0;
  font-size: 14px;
}

.report-list { list-style: none; padding: 0; margin: 0; }

.report-list li {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  background: var(--card-bg);
}

.report-list a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
}

.report-list a:hover { text-decoration: underline; }

.report-desc {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.empty-note {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
}

@media (max-width: 768px) {
  nav { position: static; width: 100%; height: auto; padding: 12px 16px; }
  nav ul { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 0; }
  nav li { flex: none; }
  nav a { padding: 5px 10px; font-size: 12px; border-radius: 4px; }
  nav a.active::before { display: none; }
  main { margin-left: 0; padding: 16px; }
}
</style>
</head>
<body>

<nav>
  <div class="site-label">ponylang</div>
  <div class="site-title">Reports</div>
  <ul>
    <li><a href="#pr-overviews" class="active">PR Overviews</a></li>
  </ul>
</nav>

<main>

<section id="about">
  <h1>Pony Reports</h1>
  <div class="summary-box">
    Reports generated during Pony development — PR overviews, research, reviews, and other reference material.
  </div>
</section>

<section id="pr-overviews">
  <h2>PR Overviews</h2>
  <p class="empty-note">No reports yet.</p>
  <!--
  <ul class="report-list">
    <li>
      <a href="example-slug/">Report title</a>
      <div class="report-desc">One-line description.</div>
    </li>
  </ul>
  -->
</section>

</main>

<script>
const sections = document.querySelectorAll('section[id]');
const navLinks = document.querySelectorAll('nav a[href^="#"]');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(a => a.classList.remove('active'));
      const link = document.querySelector('nav a[href="#' + entry.target.id + '"]');
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -60% 0px' });

sections.forEach(s => observer.observe(s));

navLinks.forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const target = document.querySelector(a.getAttribute('href'));
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  });
});
</script>

</body>
</html>
